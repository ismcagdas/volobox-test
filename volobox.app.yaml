# volobox.app.yaml — Volobox Hotels (manifest v2) — static React/Vite frontend, no backend

name: volobox-hotels

init:
  - run: npm install
    cwd: client

services:
  - name: db
    kind: compose
    file: docker-compose.preview.yml
    wait: [postgres, redis]
    waitTimeoutSeconds: 300
  - name: www
    kind: command
    cwd: client
    command: npm run dev -- --host 0.0.0.0 --port 5173
    port: 5173
    primary: true
    healthcheck: /
    restartPolicy: on-change
    dependsOn: [db]

completion:
  pauseOn: manual
  idleTimeoutMinutes: 30
